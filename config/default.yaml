# Configuración por defecto de Eyetor.
#
# Para personalizarla en un equipo, NO edites este fichero: crea
# ~/.eyetor/config.yaml con solo las claves que cambian. Se mezcla encima de
# este: los diccionarios se fusionan clave a clave y las listas/valores
# sustituyen al de aquí. (Con `eyetor -c fichero.yaml` se usa solo ese fichero.)

providers:
  openrouter:
    type: openrouter
    ssl_verify: false
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model: nvidia/nemotron-3-super-120b-a12b:free #stepfun/step-3.5-flash

  ollama:
    type: ollama
    base_url: http://localhost:11434/v1
    # thinking=true permite razonamiento solo en fases útiles. Eyetor envía
    # reasoning.effort=none en fases directas/sensibles (compaction,
    # degeneration_recovery, loop_break, chain_synthesize) para evitar
    # respuestas vacías por razonamiento largo en /v1/chat/completions.
    model: gemma4:12b-qat
    temperature: 0.3
    thinking: true
    request_timeout: 300
    max_tokens: 1024
    max_tokens_by_phase:
      main: 1536
      degeneration_recovery: 512
      loop_break: 512
      chain_plan: 512
      chain_execute: 768
      chain_synthesize: 768
      agent: 768

  llamacpp:
    type: llamacpp
    base_url: http://localhost:8080/v1
    model: default
    temperature: 0.3   # bajado de 0.5: SLM Q4 más fiable en tool-calling sin decodificación degenerada
    thinking: true   # set to true to enable reasoning channel (Gemma-4, QwQ, etc.)
    request_timeout: 300
    reasoning_budget: 384
    # Caps de generación para evitar que un modelo local se quede razonando
    # miles de tokens. Se aplican como max_tokens y n_predict.
    max_tokens: 1024
    max_tokens_by_phase:
      main: 1536
      degeneration_recovery: 512
      loop_break: 512
      chain_plan: 512
      chain_execute: 768
      chain_synthesize: 768
      agent: 768

  llamacpp-vision:
    type: llamacpp
    base_url: http://localhost:8082/v1
    model: default

  # Modelo de visión de PAGO en OpenRouter, como respaldo del local. OCR
  # fiable y barato. (google/gemini-2.0-flash-001 fue retirado de OpenRouter.)
  openrouter-vision:
    type: openrouter
    ssl_verify: false
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model: qwen/qwen3.7-flash

  gemini:
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash

fallback:
  # Proveedores probados en orden si el anterior falla (ver retry_on).
  fallback_chain: [llamacpp, openrouter, gemini]
  retry_on:
    - timeout
    - connection_error
    - malformed_response
    - "400"
    - "408"
    - "413"
    - "422"
    - "429"
    - "500"
    - "502"
    - "503"
    - "529"

skills_dirs:
  - ./skills
  - ~/.eyetor/skills
  - ~/.agents/skills

plugins_dirs:
  - ./plugins
  - ~/.eyetor/plugins

# Path to a markdown file with agent instructions and behavior rules.
# Appended to the system prompt. Can define agent roles, skill usage policies, etc.
agent_instructions: ~/.eyetor/AGENTS.md

memory_db_path: ~/.eyetor/memory.db

# Per-day, per-chat conversation archive for group chats. Stored out of the
# model context and queried on demand via the chat_history_* tools, so a small
# context window never gets saturated by a busy group.
chatlog_enabled: true
chatlog_db_path: ~/.eyetor/chatlog.db
chatlog_retention_days: 0   # 0 = keep forever; e.g. 90 purges messages older than 90 days

# Per-chat tool/skill access control. WITHOUT this block, every chat may use
# all tools and skills. WITH it, access is restrictive:
#   - keys are session_ids: "telegram-<chat_id>", "cli-*", and the special "default"
#   - lookup precedence: exact id > glob pattern (longest) > "default" > nothing
#   - "*" in a list means "all tools" / "all skills"
#   - skills are listed by skill name (e.g. "web-search"); tools by tool name
# Añade tus chats en ~/.eyetor/config.yaml, p. ej.:
#   "telegram-123456789":  {tools: ["*"], skills: ["*"]}
access:
  default:                          # any chat not listed → conversation only, no tools
    tools: []
    skills: []
  "cli-*":                          # all local CLI sessions → everything
    tools: ["*"]
    skills: ["*"]

tracking:
  db_path: ~/.eyetor/tracking.db
  month_start_day: 1        # Day of the month when billing period starts (1-31)
  month_start_hour: 0       # Hour of the day when billing period starts (0-23)
  limits:
    openrouter:
      daily_cost_usd: 10.0
      daily_tokens: 1000000

channels:
  telegram:
    enabled: true
    bot_token: ${TELEGRAM_BOT_TOKEN}
    streaming_chunk_size: 20
    ssl_verify: false
    # Documentos adjuntos (F.document). Las imágenes enviadas como archivo van a
    # visión; PDF/Office/texto se leen con los extractores de knowledge. Docs
    # cortos se inyectan en el turno; los largos entran en la KB efímera
    # (ver knowledge.uploads_retention_days).
    documents_enabled: true
    document_max_size_bytes: 20971520   # ~20 MB (límite getFile de la Bot API)
    document_inline_max_chars: 8000     # por encima → base de conocimiento
    auth:
      enabled: true
      allowed_users:
        - ${TELEGRAM_ALLOWED_USER}   # your numeric chat_id, e.g.: 123456789
      # Group chats where ANY member may talk to the bot (mention @bot or reply
      # to it). Use the group's numeric chat_id (negative, e.g. -1001234567890).
      # To let the bot read the full group history, disable its privacy mode in
      # BotFather: /setprivacy -> select the bot -> Disable.
      allowed_chats: []

  # Asistente de voz local: palabra de activación → whisper → agente → Piper.
  # Requiere: pip install -e ".[voice-assistant]" && pip install --no-deps "openwakeword>=0.6"
  # Modelos en ~/.eyetor/voice (oww/ y piper/). Dispositivos = nombres de PipeWire
  # (pactl list short sources / sinks); vacío = el predeterminado del sistema.
  # Actívalo en ~/.eyetor/config.yaml con enabled, input_device, wake_word_model…
  voice:
    enabled: false
    # Mantenimiento en reposo (al acabar cada conversación, nadie esperando):
    # con más de history_max_turns turnos se archivan todos menos los últimos
    # history_keep_turns, y los resultados de herramientas de más de
    # stale_tool_turns turnos atrás se sustituyen por una nota (estados viejos
    # de la casa). Después se recalienta la caché del prompt. Así el prompt de
    # voz no crece hasta la compactación, que se haría en mitad de una orden.
    # history_max_turns: 20
    # history_keep_turns: 12
    # stale_tool_turns: 3
    # Recalentar la caché del prompt cada N s en reposo: ~0,2 s si sigue
    # caliente; la rellena si el servidor LLM se ha reiniciado (0 = no).
    # rewarm_interval: 600

scheduler:
  enabled: true
  db_path: ~/.eyetor/scheduler.db
  default_timezone: Europe/Madrid

# Routing: classify incoming messages and apply specialized system prompts.
# Improves SLM performance by reducing prompt complexity per route.
# routing:
#   enabled: true
#   classifier_votes: 3        # voting rounds for reliable classification (1 = no voting)
#   routes:
#     coding:
#       description: "Programming, code generation, debugging, and technical tasks"
#       system_prompt: "You are an expert programmer. Focus on writing clean, correct code."
#     research:
#       description: "Information lookup, analysis, and summarization tasks"
#       system_prompt: "You are a research specialist. Be thorough and cite your sources."
#     conversation:
#       description: "General chat, greetings, and casual conversation"
#       system_prompt: "You are a friendly conversational assistant. Be concise."

orchestrator:
  # When true and at least one valid worker is configured, the main chat
  # agent gets a `delegate` tool that routes subtasks to named subagents
  # loaded from ``agents_dirs``. Disabled by default.
  auto_delegate: true
  protocol: auto        # tool_calling | text | auto (tries tool_calling, falls back to text)
  # Workers are referenced by name; each name must match an ``<name>.md``
  # file in one of the directories listed in ``agents_dirs``. Unknown
  # names are skipped at startup with a warning.
  workers:
    - researcher
    - sysadmin

# Directories scanned for subagent definitions (``<name>.md`` files with
# YAML frontmatter + Markdown body used as the system prompt). Earlier
# entries are overridden by later ones on name conflict.
agents_dirs:
  - ./agents
  - ~/.eyetor/agents

image_providers:
  gemini-flash:
    type: gemini
    provider: gemini          # inherits base_url, api_key from providers.gemini
    model: gemini-3.1-flash-image-preview

default_image_provider: gemini-flash

# Vision provider: used to describe images sent by users (multimodal LLM call).
# References one of the providers above — inherits its base_url and api_key.
# vision_model vacío → usa el modelo cargado en el servidor.
vision_provider: llamacpp-vision
vision_model:
# Respaldo probado en orden si el primario falla (server caído, cuerpo sin
# 'choices', error).
vision_fallback: [openrouter-vision]

# Transcripción de notas de voz (speech-to-text), para hablarle al bot cuando no
# se puede escribir. Por defecto local con faster-whisper (requiere el extra:
# pip install -e ".[voice]"). Sin GPU NVIDIA va por CPU.
transcription:
  enabled: true
  backend: local      # local = faster-whisper en proceso | api = endpoint OpenAI-compatible
  model: medium       # equilibrio calidad/velocidad en español (small | medium | large-v3)
  device: cpu         # CTranslate2 solo acelera en CUDA
  compute_type: int8  # rápido y ligero en CPU
  language: es        # vacío/null = autodetección
  # backend api: base_url/api_key sobrescriben WHISPER_BASE_URL / OPENAI_API_KEY
  # base_url:
  # api_key:

# Servidores MCP. Ejemplo (Home Assistant, integración "Model Context Protocol
# Server"); ponlo en ~/.eyetor/config.yaml con HA_URL y HA_TOKEN en .env:
#   homeassistant:
#     transport: http
#     url: ${HA_URL}/api/mcp
#     headers:
#       Authorization: Bearer ${HA_TOKEN}
#     group: home   # solo se envían al modelo si el mensaje habla de la casa (ver tool_gating)
mcp_servers: {}

# Knowledge base — hybrid BM25 + semantic retrieval over workspace docs.
# Requires extras: pip install -e ".[knowledge-full]" for PDF/DOCX/XLSX/PPTX
# extractors and semantic embeddings. Without the extras the KB degrades
# gracefully to BM25-only over text/markdown/code files.
knowledge:
  enabled: true
  db_path: ~/.eyetor/knowledge.db
  auto_reindex_on_start: true
  auto_cwd_workspace: true
  max_file_size_bytes: 314572800   # 300 MB (admite PDFs grandes escaneados)
  # Caducidad (en días) de los documentos que entran en la KB por uploads de
  # Telegram (workspace por chat tg-upload-<chat_id>). Admite fracciones:
  # 0.5 = 12 h, 0.042 ≈ 1 h. 0 = sin caducidad.
  uploads_retention_days: 7
  workspaces:
    - name: default
      path: ~/.eyetor/knowledge
      include:
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.go"
        - "**/*.rs"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
        - "**/*.json"
        - "**/*.ini"
        - "**/*.pdf"
        - "**/*.docx"
        - "**/*.xlsx"
        - "**/*.pptx"
      exclude:
        - "**/node_modules/**"
        - "**/.git/**"
        - "**/.venv/**"
        - "**/venv/**"
        - "**/__pycache__/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.next/**"
        - "**/target/**"
  chunk:
    max_chars: 1500
    overlap_chars: 150
  retrieval:
    top_k_default: 5
    snippet_chars: 400
    rrf_k: 60
    candidate_multiplier: 3
    full_text_hits: 3   # kb_search devuelve el texto entero de los N mejores
  # Embeddings. Lo recomendado es un servidor aparte en GPU (backend: http,
  # llama-server --embedding --pooling last con Qwen3-Embedding-0.6B): eyetor
  # no carga ningún modelo. backend: fastembed los calcula en CPU dentro del
  # proceso (~1,1 GB RSS con MiniLM). Medido con evals/kb_retrieval.py sobre
  # unos manuales de rol en PDF (30 preguntas): solo BM25 hit@5 15/30; con
  # Qwen3-Embedding 23/30; con embeddings + rerank 25/30 (MRR 0,42 → 0,72).
  # Al activarlo, los chunks ya indexados se embeben solos al reindexar y
  # cambiar de modelo regenera los vectores.
  embedding:
    enabled: false
    backend: fastembed            # fastembed | http
    # base_url: http://127.0.0.1:8090/v1   # http: endpoint OpenAI /embeddings
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    model_dir: ~/.eyetor/models/fastembed
    dim: 384                      # Qwen3-Embedding-0.6B: 1024
    batch_size: 64
  # Rerank: un cross-encoder (llama-server --rerank, p. ej. Qwen3-Reranker-0.6B)
  # reordena los mejores candidatos de BM25 + vectores. ~1,2 s por consulta en
  # una Radeon 890M con 12 candidatos; más candidatos dieron peor resultado.
  rerank:
    enabled: false
    # base_url: http://127.0.0.1:8091/v1
    candidates: 12
    max_chars: 1700

# Session persistence and compaction settings
sessions:
  persist: true
  # Conditional tool loading: only send token-heavy tool groups (scheduler,
  # image, kb, install) on turns whose text triggers them. Skills, memory and
  # delegate are always available. sticky_turns keeps a used group active for
  # N follow-up turns so "cancélalo"/"sí" still see it. Set enabled: false to
  # send every tool every turn (previous behavior).
  tool_gating:
    enabled: true
    sticky_turns: 2
    # Grupos siempre disponibles (sin depender de palabras disparadoras). "kb"
    # aquí permite responder dudas de CONTENIDO sobre los documentos indexados
    # aunque el usuario no diga "según el manual/documento". Cuesta ~3 esquemas
    # de tool por turno; quítalo si no usas la base de conocimiento.
    always_on_groups: [kb]
  chain:
    # auto | always | never — plan→execute→synthesize for long multi-step queries.
    # Off: with small models the extra plan step rarely helps, and this path
    # lacks send()'s loop and empty-reply guards.
    mode: never
    complexity_threshold: 300  # min chars to consider a message complex (auto mode)
    plan_votes: 1         # voting rounds for planning step (1 = no voting)
  compaction:
    enabled: true
    context_window: 16384     # = n_ctx real del servidor primario; mantener sincronizado si se cambia
    trigger_at_percent: 0.70
    tool_output_max_chars: 2000
    keep_last_n_user_turns: 2
    summary_max_percent: 0.05
    archive_dir: ~/.eyetor/sessions/archive

log_level: INFO
